# Disposable CI infrastructure only. Never combine with compose.yaml.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: career_profile_test_ci
      POSTGRES_USER: career_ci
      # Public, disposable fixture credential; never used by persistent environments.
      POSTGRES_PASSWORD: ci_only_disposable_password
    volumes:
      - ci_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U career_ci -d career_profile_test_ci']
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://career_ci:ci_only_disposable_password@db:5432/career_profile_test_ci
      PROFILE_TEST_DATABASE_URL: postgresql+psycopg://career_ci:ci_only_disposable_password@db:5432/career_profile_test_ci
      AGNO_TELEMETRY: 'false'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  ci_postgres_data:
